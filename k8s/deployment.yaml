# Day 4 — Kubernetes, first deployment (Sun 22 Nov 2026)
# Day 6 — rolling update (Tue 24 Nov 2026): image is now my-app:day6
# (app.py message changed to Day 6), with an explicit rolling-update
# strategy — maxSurge 1, maxUnavailable 0 — so the update rolls out
# one pod at a time with no downtime. Roll back any time with:
#   kubectl rollout undo deployment/my-app
# Note: rollout undo changes the cluster only; the files in this
# repo stay on Day 6, so re-applying this file rolls forward again.
# Day 5 — config moved out of the Deployment (Mon 23 Nov 2026):
# the container now gets its env from the app-config ConfigMap
# and the db-secret Secret (envFrom below), so no config or
# password is hard-coded here anymore. Apply the ConfigMap and
# Secret FIRST — a pod whose envFrom names a missing ConfigMap
# or Secret will not start:
#   kubectl apply -f k8s/configmap.yaml -f k8s/secret.yaml
#   kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml
#
# Deploy the Day 1-3 app to a local cluster (kind or Minikube).
# This is the app only — no database yet. The database moves to
# Kubernetes on Day 7, and config/secrets move on Day 5.
#
# Image: the local Day 6 image, built on your laptop with
#   docker build -t my-app:day6 .
# Load it into the cluster first, otherwise the pods cannot find it:
#   minikube image load my-app:day6        # Minikube
#   kind load docker-image my-app:day6     # kind
# Or roll it out without editing this file:
#   kubectl set image deployment/my-app app=my-app:day6
# After the Day 3 Docker Hub push, replace the image with
#   <your-docker-hub-username>/my-app:day6
# and the cluster will pull it instead.
#
# Apply:
#   kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml
#   kubectl get pods,svc
#   kubectl scale deployment my-app --replicas=3
#   kubectl get pods -w
#
# Visit the app (Minikube):
#   minikube service my-app --url
# Or with NodePort, on the cluster node:
#   http://localhost:30080
# You should see "Hello from Smi's Docker refresh - Day 2 is running!"
# /health will say "db": "unreachable" here — expected: there is no
# database in the cluster yet on Day 4. That is the Day 7 step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: app
          image: my-app:day6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
