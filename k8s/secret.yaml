# Day 5 — Secret: the database password (Mon 23 Nov 2026)
#
# This file holds ONLY a placeholder, "changeme" — the same default
# already in docker-compose.yml / .env.example. Never commit a real
# password here. For a real password, create the Secret from the
# command line instead and do not keep it in Git:
#
#   kubectl create secret generic db-secret \
#     --from-literal=POSTGRES_PASSWORD='<your-real-password>'
#
# Why the app does not use this Secret yet: app.py never logs in to
# Postgres — /health stops before login, so the app never needs the
# password. The password belongs to the database, which moves into
# Kubernetes on Day 7. Creating the Secret now, and keeping it out
# of the app container, is the point of Day 5: config in the
# ConfigMap, secrets in a Secret, and neither hard-coded in the
# image or the Deployment.
#
# Apply:
#   kubectl apply -f k8s/configmap.yaml -f k8s/secret.yaml
#   kubectl get secret db-secret
#   kubectl get secret db-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d; echo
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  labels:
    app: my-app
type: Opaque
stringData:
  POSTGRES_PASSWORD: "changeme"
