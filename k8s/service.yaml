# Day 4 — expose the app (Sun 22 Nov 2026)
#
# NodePort so the app is reachable from outside the cluster on a
# local Minikube/kind setup without an Ingress (Ingress is Day 6).
apiVersion: v1
kind: Service
metadata:
  name: my-app
  labels:
    app: my-app
spec:
  type: NodePort
  selector:
    app: my-app
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
